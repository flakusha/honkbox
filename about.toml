# cargo-about configuration. `accepted` mirrors the deny.toml allow-list:
# only these licenses may satisfy dependency license expressions.
# `cargo about generate about.hbs -o NOTICE` (CI `notice` job) fails on
# anything else, so the shipped NOTICE only ever names accepted licenses.
accepted = ["AGPL-3.0-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "Unlicense", "Zlib", "BSD-2-Clause", "BSD-3-Clause", "ISC", "CC0-1.0", "Unicode-3.0"]
