[package]
name = "sd-rip-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sd-rip"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true }
utoipa = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
home = { workspace = true }
toml = { workspace = true }
sd-rip-api-types = { path = "../api-types" }
sd-rip-registry = { workspace = true }
sd-rip-residency = { workspace = true }
sd-rip-sd-core = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[features]
# Gate for the experimental ash SD backend (ReviewedModules-Crates.md §4).
# Empty until the first experimental code lands, then forwards to sd-core/ash-backend.
experimental-ash-sd = []
# Vulkan execution for the sd-cpp backend (sd-rip-sd-core/vulkan → diffusion-rs/vulkan → SD_VULKAN=ON).
# Default-on: `--backend sd-cpp` (itself the default) is only a fast default on Vulkan.
vulkan = ["sd-rip-sd-core/vulkan"]
default = ["vulkan"]
