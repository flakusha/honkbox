[package]
name = "honkbox-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "honkbox"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true }
utoipa = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
home = { workspace = true }
toml = { workspace = true }
honkbox-api-types = { path = "../api-types" }
honkbox-registry = { workspace = true }
honkbox-residency = { workspace = true }
honkbox-sd-core = { workspace = true }
ulid = { workspace = true }
honkbox-llm-worker = { path = "../llm-worker" }
honkbox-audio-worker = { path = "../audio-worker" }
honkbox-recognition-worker = { path = "../recognition-worker" }
honkbox-external-tools = { path = "../external-tools" }
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
reqwest = { workspace = true }
tokio-util = { workspace = true }
sha2 = { workspace = true }
tower-http = { workspace = true }
# Pixel ops (`POST /v1/image-ops`): the same workspace-pinned `image` the
# sd-core encoders use (png/jpeg/webp features, no new codecs).
image = { workspace = true }
# Container safety (TASK-container-safety): the bounded zip reader behind
# the ORA path, and the vector/layered read path (TASK-svg-ora-support):
# XML parsing without entity expansion + a deterministic SVG rasterizer
# (no `text` feature -> no system fonts -> machine-independent output).
zip = { workspace = true }
quick-xml = { workspace = true }
resvg = { workspace = true }
tiny-skia = { workspace = true }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
# Property tests for the validator/contract surfaces (tests/validator_properties.rs):
# MIT/Apache-2.0, dev-only — the shipped binary's dependency graph is unchanged.
proptest = "1"
# Decompress the gzip path in the compression tests (byte-identity proof).
# Rust backend = the lock-resident miniz_oxide/zlib-rs, no system zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Recognition contract tests (tests/recognition.rs): QR fixture ENCODE +
# rasterization, dev-only (the runtime decode path lives in the worker).
# Both MIT/Apache-2.0-class; rxing without its `image` feature (workspace
# Cargo.toml note — the image pin stays the lock's shared 0.25.10).
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "encoders",
    "qrcode",
    "datamatrix",
    "oned",
    "aztec",
    "pdf417",
    "encoding_rs",
] }
image = { workspace = true }

[features]
# Gate for the experimental ash SD backend (ReviewedModules-Crates.md §4).
# Empty until the first experimental code lands, then forwards to sd-core/ash-backend.
experimental-ash-sd = []
# Vulkan execution for the sd-cpp backend (honkbox-sd-core/vulkan → diffusion-rs/vulkan → SD_VULKAN=ON).
# Default-on: `--backend sd-cpp` (itself the default) is only a fast default on Vulkan.
vulkan = ["honkbox-sd-core/vulkan"]
# Vision chat (mtmd/mmproj): compiles the worker's mtmd path and derives
# `capabilities.vision` from sibling-mmproj discovery. Default-on: the
# [patch.crates-io] llama-cpp-sys-4 vendor patch (workspace Cargo.toml,
# applied by `bun scripts/vendor-patches.ts sync`) adds the `vendor-hash`
# link directive the mtmd bitmap loaders reference, so the default build
# serves image input on models with a sibling mmproj projector. Kept a
# real feature: `--no-default-features` builds a text-only server where
# image parts get the named `vision_unsupported` 400 and a configured
# mmproj is a loud load error (backend.rs) — never a silent drop.
llm-vision = ["honkbox-llm-worker/vision"]
# Barcode/QR recognition (TASK-barcode-decode): compiles the worker's rxing
# backend and flips `capabilities.recognition.barcode`. Default-on:
# pure-Rust CPU decode, sub-millisecond, no foreign builds.
barcode = ["honkbox-recognition-worker/barcode"]
# audio.cpp STT backend (TASK-audiocpp-stt-provider): compiles the worker's
# audio.cpp engine (core + bundled VAD) plus the default ASR family loader
# (`qwen3_asr`, eSpeak-free). Non-default — the vendored engine is a heavy
# CMake build; `--stt-backend audio-cpp` without this feature is a loud
# named error at the CLI seam (backends.rs), never a silent fallback.
audio-cpp = [
    "honkbox-audio-worker/audio-cpp",
    "honkbox-audio-worker/audio-cpp-qwen3-asr",
]
default = ["vulkan", "llm-vision", "barcode"]
