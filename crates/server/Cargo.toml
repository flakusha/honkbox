[package]
name = "honkbox-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "honkbox"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true }
utoipa = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
home = { workspace = true }
toml = { workspace = true }
honkbox-api-types = { path = "../api-types" }
honkbox-registry = { workspace = true }
honkbox-residency = { workspace = true }
honkbox-sd-core = { workspace = true }
ulid = { workspace = true }
honkbox-llm-worker = { path = "../llm-worker" }
honkbox-audio-worker = { path = "../audio-worker" }
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
reqwest = { workspace = true }
tokio-util = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[features]
# Gate for the experimental ash SD backend (ReviewedModules-Crates.md §4).
# Empty until the first experimental code lands, then forwards to sd-core/ash-backend.
experimental-ash-sd = []
# Vulkan execution for the sd-cpp backend (honkbox-sd-core/vulkan → diffusion-rs/vulkan → SD_VULKAN=ON).
# Default-on: `--backend sd-cpp` (itself the default) is only a fast default on Vulkan.
vulkan = ["honkbox-sd-core/vulkan"]
# Vision chat (mtmd/mmproj): compiles the worker's mtmd path and derives
# `capabilities.vision` from sibling-mmproj discovery. Opt-in for the same
# vendor-link reason as `honkbox-llm-worker/vision` (see its Cargo.toml):
# llama-cpp-sys-4 0.11.0 static builds cannot link the mtmd bitmap loader
# until a vendor patch adds the missing `vendor-hash` link directive.
llm-vision = ["honkbox-llm-worker/vision"]
default = ["vulkan"]
