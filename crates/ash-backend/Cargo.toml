[package]
name = "honkbox-ash-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Local mirror of [workspace.lints] (see root Cargo.toml). The crate does NOT
# use `lints.workspace = true` because workspace lint inheritance is
# all-or-nothing — cargo rejects per-lint overrides alongside it — and this
# crate must flip one lint (see below). Keep the tables in sync with the
# workspace when workspace lints change.
[lints.rust]
# Workspace-wide `unsafe_code = "forbid"` cannot be lifted in-source either
# (a `forbid` lint cannot be re-allowed by any attribute), and Vulkan is a C
# ABI: no Vulkan operation is expressible without `unsafe`. This crate is the
# one sanctioned exception: `allow` here, then a crate-root
# `#![deny(unsafe_code)]` confining every `unsafe` block to src/raw.rs (each
# with a SAFETY comment) — unsafe anywhere else stays a compile error.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[features]
default = []
# Compute kernels need only `ash`; keeping this separate lets the first slice
# build and test without pulling the vendored diffusion-rs stack.
ash-compute = ["dep:ash"]
# Experimental direct-Vulkan path: one flag for the whole ash surface.
# `server/ash-sd` forwards here (server wiring is a later
# ticket), and this forwards `ash-backend` to sd-core, mirroring
# `server/vulkan → sd-core/vulkan`.
ash-sd = [
  "dep:ash",
  "dep:honkbox-sd-core",
  "honkbox-sd-core/ash-backend",
  "ash-compute",
]
# Experimental direct-Vulkan LLM seam (slice 8): the `LlmPipeline` placeholder
# in `llm.rs`. Kept separate from `ash-sd` so each modality can
# land and be enabled independently; `server/ash-llm` forwards
# here. `honkbox-llm-worker` is declared by path (the workspace table does
# not carry it — `crates/server` uses the same form).
ash-llm = ["dep:ash", "dep:honkbox-llm-worker", "ash-compute"]
# Experimental direct-Vulkan STT/TTS seams (slice 15): trait-implementing
# placeholders in `stubs.rs`, same posture as `ash-llm`. One
# optional path dep shared by both features (the workspace table does not
# carry `honkbox-audio-worker` — `crates/server` uses the same form).
ash-stt = ["dep:ash", "dep:honkbox-audio-worker", "ash-compute"]
ash-tts = ["dep:ash", "dep:honkbox-audio-worker", "ash-compute"]

[dependencies]
ash = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
honkbox-sd-core = { workspace = true, optional = true }
honkbox-llm-worker = { path = "../llm-worker", optional = true }
honkbox-audio-worker = { path = "../audio-worker", optional = true }

[dev-dependencies]
honkbox-residency = { workspace = true }
sha2 = { workspace = true }
