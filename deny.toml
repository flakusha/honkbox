# cargo-deny configuration. License policy mirrors ReviewedLicense-AGPL §6.6:
# our own AGPL-3.0-or-later workspace id is allowed; incoming third-party
# GPL/LGPL/AGPL (and SSPL/Elastic/BUSL/NC) dependencies stay denied, so the
# AGPL status remains a deliberate choice rather than a transitive accident.
[licenses]
# cargo-deny >= 0.19 is allowlist-only: anything not in `allow` is denied.
allow = ["AGPL-3.0-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "Unlicense", "Zlib", "BSD-2-Clause", "BSD-3-Clause", "ISC", "CC0-1.0", "Unicode-3.0",
  "NCSA", "MPL-2.0", "CDLA-Permissive-2.0"]
# 2026-11-15 (diffusion-rs 0.1.20): NCSA = libfuzzer-sys (build-only, permissive UIUC);
# CDLA-Permissive-2.0 = webpki-roots CA data (permissive); MPL-2.0 = option-ext (via
# dirs→hf-hub; §3.3 Secondary-License compatible with our AGPL Larger Work, file-level,
# attribution via NOTICE). Policy (GPL/LGPL/AGPL-incoming denied) unchanged.
exceptions = [] # any exception needs a dated comment + ticket
[advisories]
# 2026-11-15, all transitive via diffusion-rs/image, no safe upgrade; revisit on bump:
# - RUSTSEC-2024-0436 paste unmaintained (little_exif/rav1e): proc-macro, no runtime surface.
# - RUSTSEC-2026-0194/0195 quick-xml 0.37 XML-DoS (little_exif PNG-EXIF path): little_exif pins 0.37,
#   blocks 0.41. The SERVER's own quick-xml dependency is 0.41 (patched) — the SVG/ORA read path parses
#   untrusted XML, so it is not covered by this ignore; only little_exif's transitive 0.37 is.
# Pin bump: RUSTSEC-2025-0119 (number_prefix) dropped - crate no longer in lock (deny advisory-not-detected).
# 2026-11-15, all transitive via any-tts→audio-worker→server; revisit on any-tts/lindera/candle bump:
# - RUSTSEC-2021-0153 encoding unmaintained (lindera-dictionary 2.3.4): no fixed release exists.
# - RUSTSEC-2024-0449 unsafe-libyaml unmaintained (serde_yaml_ng 0.10.0→lindera 2.3.4): upstream archived, no fixed release.
# - RUSTSEC-2026-0367/0368/0369/0429 zip 7.4.0 (any-tts requires "7.2", candle-core requires "7.2.0"): fix is 9.0.0 major, outside both caret ranges.
# 2026-11-18, published after the ignore list above was written; all pre-existing in the lock:
# - RUSTSEC-2026-0542 humantime unmaintained (xet-runtime→hf-hub→diffusion-rs): no safe upgrade exists.
# - RUSTSEC-2026-0543 chrono unmaintained (diffusion-rs, llama-cpp's patch-apply): no safe upgrade exists.
# - RUSTSEC-2026-0545 zip 7.4.0 AES entries skip the auth check: AES archives are never decrypted here
#   (the `aes-crypto` feature is not enabled in this build).
# - RUSTSEC-2026-0546 zip 7.4.0 `ZipArchive::extract` can escape the destination via symlink targets:
#   nothing here extracts to disk — the container reader reads entries into memory by central-directory
#   name (crates/server/src/container.rs).
# - RUSTSEC-2026-0547 zip 7.4.0 legacy Shrink/Reduce/Implode preallocate the declared size: only the
#   `legacy-zip` feature is affected, and it is not enabled.
# - RUSTSEC-2026-0548 zip 7.4.0 local-header names can differ from the central directory: the fix is
#   again 9.0.0 (major). The server's own reader lists AND reads through ZipArchive (central-directory
#   names) and never extracts by local-header name, so the check/extract mismatch it describes does
#   not apply to that path.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0194", "RUSTSEC-2026-0195", "RUSTSEC-2021-0153", "RUSTSEC-2024-0449", "RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369", "RUSTSEC-2026-0429", "RUSTSEC-2026-0542", "RUSTSEC-2026-0543", "RUSTSEC-2026-0545", "RUSTSEC-2026-0546", "RUSTSEC-2026-0547", "RUSTSEC-2026-0548"]
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are publish=false (private): path deps carry no version by design.
allow-wildcard-paths = true
