# honkbox CI.
#
# NOTE: this repo starts with no remote; this workflow first runs on the first
# push after a remote is added.
#
# Workflow mirroring the local `bun run ci` gate job-for-job; local hook
# checks (`hooks:check`) are not mirrored in CI.
# Pins: BUN_VERSION below; Rust comes from rust-toolchain.toml (channel 1.99.0),
# so the dtolnay action takes NO `toolchain:` input — the root pin is what
# makes local and CI agree. No rust-cache/sccache at init (adopt on evidence).

# Vendor rule: every job invoking cargo needs `bun scripts/vendor-patches.ts sync`
# first (workspace [patch.crates-io] points at gitignored vendor/). TS-only jobs
# (lint-ts, typecheck, test-ts) and reuse never resolve the workspace: no fetch.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Check TS/JSON formatting
        run: bunx dprint check
      - name: Check Rust formatting
        run: cargo fmt --check

  lint-ts:
    name: Lint TS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # oxlint correctness rules are errors by default, so a bare run denies them.
      - name: Lint TS
        run: bunx oxlint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit

  test-ts:
    name: Test TS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run TS tests
        run: bun test --isolate --pass-with-no-tests --coverage --coverage-reporter=lcov
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ts
          path: lcov.info
          if-no-files-found: warn

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libvulkan-dev glslang-tools spirv-headers
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (CPU-only)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  test-rs:
    name: Test Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # llama-cpp-sys builds shared libs by default (dynamic-link); the test
    # binaries then need the .so at runtime. Static keeps tests hermetic.
    env:
      LLAMA_BUILD_SHARED_LIBS: "OFF"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libvulkan-dev glslang-tools spirv-headers
      - name: Install native build deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake llvm -y
      - name: Install native build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
      - name: Test (Vulkan)
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked
      - name: Test (CPU-only)
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked --no-default-features

  lavapipe:
    name: Lavapipe (CPU Vulkan smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same hermetic-static reason as test-rs.
    env:
      LLAMA_BUILD_SHARED_LIBS: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Mesa Vulkan drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers cmake clang libvulkan-dev glslang-tools spirv-headers
      # Proves the GPU-optional path works where no GPU exists.
      - name: Test workspace under lavapipe
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check licenses, bans, advisories
        run: cargo deny check licenses bans advisories

  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install reuse tool
        run: pipx install reuse==6.3.0
      - name: Lint licensing
        run: reuse lint

  notice:
    name: NOTICE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.3 --features cli
      # Fails on any dependency license outside about.toml `accepted`.
      - name: Generate NOTICE
        run: cargo about generate about.hbs -o NOTICE

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libvulkan-dev glslang-tools spirv-headers
      - name: Check docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  codegen:
    name: Codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libvulkan-dev glslang-tools spirv-headers
      # Regenerates packages/web-ui/src/gen/ and fails on drift (git diff).
      # NOTE: the OpenAPI exporter builds honkbox-server, hence the native deps above.
      - name: Check generated OpenAPI + API types
        run: bun run codegen:check

  vendor-patches:
    name: Vendor patches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Real sync: proves every manifest pin is fetchable end to end.
      - name: Sync vendored sources
        run: bun scripts/vendor-patches.ts sync
      - name: Re-sync is a no-op
        run: bun scripts/vendor-patches.ts sync
  experimental:
    name: Experimental ash-sd (allow-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libvulkan-dev glslang-tools spirv-headers
      - name: Check experimental feature
        run: cargo check -p honkbox-server --features experimental-ash-sd --locked

  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [fmt, lint-ts, typecheck, test-ts, clippy, test-rs, lavapipe, deny, reuse, notice, doc, codegen]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch vendored sources
        run: bun scripts/vendor-patches.ts sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libvulkan-dev glslang-tools spirv-headers
      - name: Install native build deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake llvm -y
      - name: Install native build deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV
      - name: Build frontend + vendor
        run: bun run build:vendor && bun run build:web
      - name: Build release binary (Vulkan)
        if: runner.os == 'Linux'
        run: bun run build:release
      - name: Build release binary (CPU-only)
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p honkbox-server --no-default-features
