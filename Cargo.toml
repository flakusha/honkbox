[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8.14.0"
ts-rs = "12.0.1"
utoipa = "6.0.0"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
home = "0.5"
# Registry cache DB (crates/registry): bundled SQLite — no system lib
# dependency; libsqlite3-sys MIT shim + public-domain C, accepted by deny.toml.
# Pinned to 0.41+: bundled SQLite >= 3.54 fixes RUSTSEC-2026-0459
# (CVE-2026-119375, WAL page-size memory exposure in older bundles).
rusqlite = { version = "0.41", features = ["bundled"] }
toml = "1"
llama-cpp-4 = "0.11"
honkbox-registry = { path = "crates/registry" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
diffusion-rs = "=0.1.20"
ulid = "1"
# Downloads (crates/server/src/downloads.rs): rustls TLS only (no
# native-tls), streaming response bodies, and sha2 for the HF LFS sha256
# checksum; tokio-util provides the per-download CancellationToken.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
    "http2",
    "json",
] }
tokio-util = "0.7"
sha2 = "0.11"
honkbox-residency = { path = "crates/residency" }
honkbox-sd-core = { path = "crates/sd-core" }
honkbox-ash-backend = { path = "crates/ash-backend" }
# Experimental direct-Vulkan bindings (crates/ash-backend): `loaded` dlopens
# libvulkan at runtime, so loader-less machines build and tests skip
# gracefully; `debug` derives Debug on the vk types we expose.
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Profiles: dev stays Cargo default (fast incremental rebuilds).
# Deferred (add only when measured): fat LTO (when thin-LTO gains plateau and slower links affordable);
# codegen-units = 1 (when single-digit % runtime beats link parallelism); panic = "abort"
# (when binary size/panic-unwind cost measured and abort acceptable); custom profiles
# e.g. dist/release-fast (when a second release tradeoff is actually used);
# per-package overrides (when one crate provably needs different opts).
# Optimize dependency code in dev builds too: Cargo's default opt-level 0 makes
# pure-Rust compute deps (e.g. image decode/resize in honkbox-sd-core) unusably
# slow at inference time. Workspace crates stay at opt-level 0, so incremental
# rebuilds of our own code stay fast; only the initial cold dep build costs more.
# NOTE: this does NOT speed up the C/C++ backends. stable-diffusion.cpp
# (vendor/diffusion-rs), llama.cpp (llama-cpp-sys), whisper.cpp (whisper-rs) and
# ONNX Runtime (ort) are cmake/foreign builds — their optimization is governed
# by their own build flags (vendor_patches / vendor.manifest.toml and
# .cargo/config.toml env), not by Rust opt-level.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"
lto = "thin"

# Pin bump: sd.cpp master-1104 (5dcfa79) vendored in-repo (local-first; no upstream remote) + Rust FFI port to the new C ABI.
[patch.crates-io]
diffusion-rs = { path = "vendor/diffusion-rs" }
diffusion-rs-sys = { path = "vendor/diffusion-rs/sys" }
